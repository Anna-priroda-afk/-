<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Уральский каркас">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17382a"/>
      <stop offset="1" stop-color="#07110d"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="48" cy="16" r="13" fill="#4ade80" opacity=".12"/>

  <!-- Дом -->
  <path d="M32 12 56 31v23H8V31z" fill="url(#house)"/>
  <path d="M5 33 32 10l27 23" fill="none" stroke="#bef264" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Дверь и окна — вырезаны цветом фона -->
  <path d="M27 54V41a5 5 0 0 1 10 0v13z" fill="#07110d"/>
  <rect x="14" y="35" width="7" height="7" rx="1.5" fill="#07110d"/>
  <rect x="43" y="35" width="7" height="7" rx="1.5" fill="#07110d"/>

  <!-- Маленький акцент на двери -->
  <circle cx="33" cy="47" r="1.3" fill="#bef264"/>
</svg>
